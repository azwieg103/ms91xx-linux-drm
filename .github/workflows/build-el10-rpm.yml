name: Build and test EL10 DKMS RPMs

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**'
      - '.github/workflows/build-el10-rpm.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ms91xx-dkms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-rpm:
    name: Build and test on ${{ matrix.distro }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: AlmaLinux 10
            image: almalinux:10
          - distro: Rocky Linux 10
            image: quay.io/rockylinux/rockylinux:10
          - distro: Oracle Linux 10
            image: oraclelinux:10
          - distro: CentOS Stream 10
            image: quay.io/centos/centos:stream10

    steps:
      - name: Install build and DKMS test dependencies
        shell: bash
        run: |
          set -euxo pipefail
          dnf -y install dnf-plugins-core
          dnf -y install https://dl.fedoraproject.org/pub/epel/epel-release-latest-10.noarch.rpm
          dnf -y install gcc make elfutils-libelf-devel rpm-build rpmdevtools kernel-devel tar gzip findutils dkms
          rpm -q kernel-devel dkms
          test -d "/usr/src/kernels/$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-devel)"

      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(awk '$1 == "Version:" { print $2; exit }' packaging/rpm/ms91xx-linux-drm.spec)"
          test -n "$VERSION"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            test "$TAG_VERSION" = "$VERSION"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Build binary RPM and SRPM
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euxo pipefail
          TOP="$HOME/rpmbuild"
          mkdir -p "$TOP"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}
          tar -czf "$TOP/SOURCES/ms91xx-linux-drm-${VERSION}.tar.gz" \
            --transform="s,^\\./,ms91xx-linux-drm-${VERSION}/," \
            --exclude='./.git' .
          cp packaging/rpm/ms91xx-linux-drm.spec "$TOP/SPECS/"
          rpmbuild -ba "$TOP/SPECS/ms91xx-linux-drm.spec" --define "_topdir $TOP"
          mkdir -p dist
          find "$TOP/RPMS" "$TOP/SRPMS" -type f \
            \( -name '*.rpm' -o -name '*.src.rpm' \) -exec cp -v {} dist/ \;
          rpm -qp --info dist/ms91xx-linux-drm-dkms-${VERSION}-*.rpm
          rpm -qp --requires dist/ms91xx-linux-drm-dkms-${VERSION}-*.rpm

      - name: Install RPM and verify DKMS module build
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euxo pipefail
          KVER="$(rpm -q --qf '%{VERSION}-%{RELEASE}.%{ARCH}' kernel-devel | tail -n1)"
          mkdir -p "/lib/modules/$KVER"
          ln -sfn "/usr/src/kernels/$KVER" "/lib/modules/$KVER/build"
          RPM_FILE="$(find dist -maxdepth 1 -type f -name "ms91xx-linux-drm-dkms-${VERSION}-*.noarch.rpm" -print -quit)"
          test -n "$RPM_FILE"
          dnf -y install "$RPM_FILE"
          dkms status -m msdisp -v "$VERSION"
          modinfo -k "$KVER" usbdisp_drm
          modinfo -k "$KVER" usbdisp_usb
          modinfo -k "$KVER" -F version usbdisp_drm | grep -Fx "$VERSION"
          modinfo -k "$KVER" -F version usbdisp_usb | grep -Fx "$VERSION"
          test -e "/lib/modules/$KVER/extra/usbdisp_drm.ko" -o -e "/lib/modules/$KVER/extra/usbdisp_drm.ko.xz"
          test -e "/lib/modules/$KVER/extra/usbdisp_usb.ko" -o -e "/lib/modules/$KVER/extra/usbdisp_usb.ko.xz"
          test -f /usr/lib/modules-load.d/msdisp.conf
          cat /usr/lib/modules-load.d/msdisp.conf

      - name: Collect DKMS diagnostics
        if: always()
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set +e
          dkms status -m msdisp -v "$VERSION"
          find /var/lib/dkms/msdisp -name make.log -type f -print -exec cat {} \\; 2>/dev/null

      - name: Upload RPM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ms91xx-dkms-rpm-${{ matrix.distro }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish versioned RPM release
    needs: build-rpm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested AlmaLinux RPM artifacts
        uses: actions/download-artifact@v4
        with:
          name: ms91xx-dkms-rpm-AlmaLinux 10-${{ github.sha }}
          path: release-assets

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*.rpm
